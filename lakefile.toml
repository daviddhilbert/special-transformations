name = "special_transformations"
version = "0.1.0"
description = "Section-by-section formalization of Yimu Yin's Special transformations"
license = "MIT"
authors = ["Yimu Yin"]
defaultTargets = ["SpecialTransformations"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[require]]
name = "acvf_qe"
git = "https://github.com/daviddhilbert/ACVF-QE.git"
rev = "f3ef4ee679f921079aa8f742a2807a9cc724d2d6"

[[lean_lib]]
name = "SpecialTransformations"
roots = ["SpecialTransformations"]

[[lean_lib]]
name = "Section3"
roots = ["Section3.Library"]
globs = ["Section3.AlgebraicFinite", "Section3.AlgebraicityDescent", "Section3.Average", "Section3.BallGeometry", "Section3.ClosureBridge", "Section3.Compactness", "Section3.Coordinates", "Section3.Counting", "Section3.DefinableCompactness", "Section3.FibreDescent", "Section3.FiniteRelations", "Section3.FiniteImage", "Section3.FieldBase", "Section3.RingSyntax", "Section3.PolynomialRoots", "Section3.RootDefinability", "Section3.Library", "Section3.ModelContext", "Section3.ParameterBridge", "Section3.Parameters", "Section3.PolynomialLocal", "Section3.PolynomialSyntax", "Section3.QFLocal", "Section3.QuantifierFree", "Section3.QuotientFamilies", "Section3.RVLiteralReduction", "Section3.RVNormalForm", "Section3.RVTermLocal", "Section3.RawAlgebraicity", "Section3.TupleCompactness", "Section3.TupleDescent", "Section3.TuplePromotion", "Section3.TupleRelations", "Section3.VFAclField", "Section3.VFAlgebraicity", "Section3.ValuedCMinimal", "Section3.ValuedNeighbourhood"]
