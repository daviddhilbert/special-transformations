name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[require]]
name = "acvf_qe"
git = "https://github.com/daviddhilbert/ACVF-QE.git"
rev = "f3ef4ee679f921079aa8f742a2807a9cc724d2d6"

