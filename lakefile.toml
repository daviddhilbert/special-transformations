name = "special_transformations"
version = "0.1.0"
description = "Section-by-section formalization of Yimu Yin's Special transformations"
license = "MIT"
authors = ["Yimu Yin"]
defaultTargets = ["SpecialTransformations"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[require]]
name = "acvf_qe"
git = "https://github.com/daviddhilbert/ACVF-QE.git"
rev = "f3ef4ee679f921079aa8f742a2807a9cc724d2d6"

[[lean_lib]]
name = "SpecialTransformations"
roots = ["SpecialTransformations"]

[[lean_lib]]
name = "Section3"
roots = ["Section3.Library"]
