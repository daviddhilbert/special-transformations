  notes: >-
    Historical model identifiers and aggregate costs were not tracked.
    Human authorship and responsibility are distinct from AI assistance.
fidelity:
  divergences: >-
    RV inversion is named and totalized at zero under the author's correction
    to the paper's language specification; VF inversion remains unnamed.
    RV has one absorbing element. Mathlib's multiplicative valuation order
    reverses the paper's additive order. Definition 2.4 uses the documented
    rational correction, and Remark 3.19 is retracted. Sections 9 and 10
    retain the documented finite-volume and differentiation corrections.
    These limitations are disclosed rather than attributed silently to the
    literal printed statements. Source-to-paper fidelity is self-assessed;
    exact-snapshot machine verification is recorded separately by the
    Comparator configuration and GitHub Actions reports.
review:
  status: "self-assessed; no independent expert review claimed"
  reviewers: []
  notes: >-
    The module-format library build and 3,543 headline audits passed at
    f2fbe2eea4083bb21174fa48b720eb80a901fbc0 (GitHub Actions run 43274534495),
    with only the permitted logical axioms. The independent statement pair
    requires its own exact-snapshot compilation and full Palomar preflight.
    The twelve legacy sorry/admit tokens occur only in
    Section3/Sec3_frozen.lean and Section3/Sec3_sat.lean, which are excluded
    from the active library. Deliberate holes in the independent Challenge
    are specifications, not claimed source proofs. The canonical and focus
    definable-map implementations have intentional definition holes,
    constrained by unconditional pointwise equations. Their types require
    definability over the original parameter set; these equations fully
    determine the maps by proof irrelevance. The Solution proves both
    equations by reflexivity from the existing implementations. No independent human
    expert review or Palomar acceptance is claimed.
alignment:
  namespace: "SpecialTransformations"
  statements:
    - source: "Yin, Theorem 5.5"
      lean: "SpecialTransformations.Section5.Paper.theorem_5_5"
      module: "Section5.Surjectivity"
      status: proved
      note: >-
        Pure characteristic zero, genuine saturation, a small parameter set,
        and polynomial coefficients in that set. The output is an
        RV-pullback and polynomial RV values are constant on its RV fibres.
    - source: "Yin, Corollary 5.6"
      lean: "SpecialTransformations.Section5.Paper.corollary_5_6"
      module: "Section5.Surjectivity"
      status: proved
      note: "Deformation to an RV-pullback over the original small parameter set."
acknowledgements: >-
  Lean and Mathlib contributors; the separately attributed upstream proof
  adaptations; the Stacks Project and its Lean formalization where cited
