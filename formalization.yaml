version: "v0.4"
project:
  name: "Special transformations in algebraically closed valued fields"
  description: >-
    A Lean formalization of special transformations and RV lifting in
    algebraically closed valued fields of pure characteristic zero. The
    first Comparator configuration selects Theorem 5.5 and Corollary 5.6:
    special-bijection deformation to RV-pullbacks and preparation of
    polynomial RV values. Genuine saturation and a small original parameter
    set are explicit. Jacobian and measured-lifting results remain in the
    larger verified library but are outside this first submission claim.
  authors: ["Yimu Yin"]
  responsible_maintainers: ["Yimu Yin"]
  license: "MIT"
classification:
  arxiv: ["math.LO"]
  msc2020: ["03C60", "03B35"]
sources:
  - title: "Special transformations in algebraically closed valued fields"
    authors: ["Yimu Yin"]
    id: "arXiv:1006.2467v1"
    location: "https://arxiv.org/abs/1006.2467v1"
    type: paper
    relationship: formalizes
    note: >-
      Theorem 5.5 and Corollary 5.6, the core deformation results, in
      the corrected RV language. Later Jacobian and measured-lifting
      results are not part of this first Comparator selection.
  - title: "Model Theory: An Introduction"
    authors: ["David Marker"]
    type: book
    relationship: background
    note: "Types, saturation, compactness and elementary maps."
related_formalizations:
  - id: "https://github.com/daviddhilbert/ACVF-QE"
    relationship: builds-on
    note: >-
      The pinned shared language, RV encoding and checked QE foundation.
      The exact dependency revision is recorded in lake-manifest.json.
  - id: "https://github.com/TauCetiProject/TauCeti"
    relationship: adapts
    note: >-
      GrothendieckRing port from revision
      027f880ff251fa1cbd16ee9d6c03fb74ea254bed. Apache-2.0 attribution
      and the imported module README are retained under Section4/Imported.
status:
  scope: >-
    Two core deformation entry points: Theorem 5.5 and Corollary 5.6.
    They require a pure-characteristic-zero ACVF model, genuine saturation
    and a parameter set smaller than its saturation bound. Theorem 5.5
    further specifies a given special bijection and a polynomial with all
    coefficients in the parameter set. Tuple arities can be zero. No strong
    homogeneity, VF/Gamma-generated base or henselian reference input is
    a hypothesis of these two headlines. Legacy source is not active
    proof evidence; later-section results are outside this first comparison.
  sorry_count: 12
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
automation:
  methods:
    - method: agent
      models: []
      framework: "Codex / ChatGPT"
      tool_setup: "Author-directed Lean development, compilation and headline audits."
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "Local development and GitHub Actions verification."
      prompting_notes: "Exact scope, parameter bases and explicit reference hypotheses."
