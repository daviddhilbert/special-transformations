name = "special-transformations"
version = "0.1.0"
description = "Formalization of Yimu Yin, Special transformations in algebraically closed valued fields (2010)"
keywords = ["math", "logic", "valued fields", "motivic integration"]
license = "MIT"
authors = ["Yimu Yin"]
defaultTargets = ["SpecialTransformations"]

# Mathlib is prebuilt and read-only in this VM; depend on it by path so Lake
# reuses /opt/mathlib's artifacts instead of fetching and rebuilding Mathlib.
[[require]]
name = "mathlib"
path = "/opt/mathlib"

[[lean_lib]]
name = "SpecialTransformations"
srcDir = "."
roots = ["SpecialTransformations"]
