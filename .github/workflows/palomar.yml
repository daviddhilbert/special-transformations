name: Palomar mechanical preflight
on:
  push:
    branches: [codex/palomar-submission]
    paths-ignore: [".github/workflows/palomar-statements.yml", ".github/workflows/palomar.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: palomar-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: stcorecheck1
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
