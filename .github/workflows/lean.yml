name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pinned build and headline audits
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out this revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the pinned Lean toolchain
        id: setup
        shell: bash
        run: |
          if [[ $(<lean-toolchain) != leanprover/lean4:v4.33.1 ]]; then
            echo "Update the release asset and checksum for the new Lean pin."
            exit 1
          fi
          archive="$RUNNER_TEMP/lean-4.33.1-linux.tar.zst"
          # The release API serves the official archive when the release-page
          # download route times out.
          curl --fail --silent --show-error --location --retry 4 --connect-timeout 15 \
            --max-time 600 --header 'Accept: application/octet-stream' \
            --output "$archive" https://api.github.com/repos/leanprover/lean4/releases/assets/523687465
          printf '%s  %s\n' 890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235 "$archive" |
            sha256sum --check --strict
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP"
          rm "$archive"
          toolchain="$RUNNER_TEMP/lean-4.33.1-linux/bin"
          "$toolchain/lean" --version
          "$toolchain/lake" --version
          echo "$toolchain" >> "$GITHUB_PATH"

      - name: Restore cached Mathlib dependencies
        env:
          MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
        run: lake exe cache get

      - name: Register the pinned QE package's sibling modules
        run: python3 scripts/prepare_ci.py

      - name: Check compiled import cache provenance
        id: provenance
        run: python3 scripts/test_lean_provenance.py

      - name: Build the pinned project from source
        id: build
        shell: bash
        run: |
          mkdir -p .scratch/ci-verified
          lake -R build 2>&1 | tee .scratch/ci-verified/Build.log

      - name: Audit published QE headline types and axioms
        id: foundation
        run: lake env python3 scripts/verify_ci.py

      - name: Audit Section 3 when its verifier is present
        id: section3
        if: ${{ success() && hashFiles('Section3/verify.py') != '' }}
        run: lake env python3 Section3/verify.py

      - name: Audit Section 4 when its verifier is present
        id: section4
        if: ${{ success() && hashFiles('Section4/verify.py') != '' }}
        run: lake env python3 Section4/verify.py

      - name: Audit Section 5 when its verifier is present
        id: section5
        if: ${{ !cancelled() && steps.build.outcome == 'success' && hashFiles('Section5/verify.py') != '' }}
        run: lake env python3 Section5/verify.py

      - name: Audit Section 7 when its verifier is present
        id: section7
        if: ${{ !cancelled() && steps.build.outcome == 'success' && hashFiles('Section7/verify.py') != '' }}
        run: lake env python3 Section7/verify.py

      - name: Publish verification summary
        if: ${{ always() }}
        shell: bash
        run: |
          cat <<'SUMMARY' >> "$GITHUB_STEP_SUMMARY"
          ## Lean verification

          | Check | Outcome |
          | --- | --- |
          | Pinned project build | ${{ steps.build.outcome }} |
          | Compiled import cache regression checks | ${{ steps.provenance.outcome }} |
          | Published QE headline types and axioms | ${{ steps.foundation.outcome }} |
          | Section 3 verifier, if present | ${{ steps.section3.outcome }} |
          | Section 4 verifier, if present | ${{ steps.section4.outcome }} |
          | Section 5 verifier, if present | ${{ steps.section5.outcome }} |
          | Section 7 verifier, if present | ${{ steps.section7.outcome }} |

          Download the verification artifact for compiler logs and headline audits.
          A skipped step is not a passed check. This run covers the current library
          entry points and selected headlines, not every paper result or legacy file.
          Explicit hypotheses and fidelity to the paper still need review.
          SUMMARY

      - name: Retain verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: lean-verification-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
          path: |
            lean-toolchain
            lake-manifest.json
            .scratch/ci-verified/*
            .scratch/section3-verified/*.log
            .scratch/section3-verified/*.json
            .scratch/section3-verified/*.txt
            .scratch/section3-verified/HeadlineAudit.lean
            .scratch/section4-verified/*.log
            .scratch/section4-verified/*.json
            .scratch/section4-verified/*.txt
            .scratch/section4-verified/HeadlineAudit.lean
            .scratch/section4-verified/CombinedImport.lean
            .scratch/section5-verified/*.log
            .scratch/section5-verified/*.json
            .scratch/section5-verified/*.txt
            .scratch/section5-verified/*.lean
            .scratch/section7-verified/*.log
            .scratch/section7-verified/*.json
            .scratch/section7-verified/*.txt
            .scratch/section7-verified/*.lean
