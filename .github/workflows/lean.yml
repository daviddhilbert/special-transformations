name: Lean verification

on:
  push:
    branches: [main, codex/palomar-submission]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 12 * * 1"

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pinned build and headline audits
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out this revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - name: Select verification scope
        id: scope
        shell: bash
        run: |
          mode=built
          if [[ "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            mode=all
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]] &&
               git rev-parse --verify --quiet HEAD^1 >/dev/null &&
               git diff --quiet --no-renames HEAD^1 HEAD -- . ':(exclude)Section10/**' &&
               [[ -n "$(git diff --name-only --no-renames HEAD^1 HEAD -- Section10/)" ]]; then
            mode=section10
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the pinned Lean toolchain
        id: setup
        shell: bash
        run: |
          if [[ $(<lean-toolchain) != leanprover/lean4:v4.35.0 ]]; then
            echo "Update the release asset and checksum for the new Lean pin."
            exit 1
          fi
          archive="$RUNNER_TEMP/lean-4.35.0-linux.tar.zst"
          # The release API serves the official archive when the release-page
          # download route times out.
          curl --fail --silent --show-error --location --retry 4 --connect-timeout 15 \
            --max-time 600 --header 'Accept: application/octet-stream' \
            --output "$archive" https://api.github.com/repos/leanprover/lean4/releases/assets/634574462
          printf '%s  %s\n' 7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d "$archive" |
            sha256sum --check --strict
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP"
          rm "$archive"
          toolchain="$RUNNER_TEMP/lean-4.35.0-linux/bin"
          "$toolchain/lean" --version
          "$toolchain/lake" --version
          echo "$toolchain" >> "$GITHUB_PATH"

      - name: Restore cached Mathlib dependencies
        env:
          MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
        run: lake exe cache get

      - name: Restore exact-source compiled project cache
        id: project_cache
        uses: actions/cache@v4
        with:
          path: |
            .lake/build
            .lake/packages/acvf_qe/.lake/build
          key: paper-compiled-v1-${{ hashFiles('**/*.lean', '!PalomarPaperChallenge.lean', '!PalomarPaperSolution.lean', '!.lake/**', '!.scratch/**', 'lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}

      - name: Check the pinned QE package's module registration
        run: python3 scripts/prepare_ci.py

      - name: Check compiled import cache provenance
        id: provenance
        run: python3 scripts/test_lean_provenance.py

      - name: Build the pinned project with exact-source cache
        id: build
        if: ${{ steps.scope.outputs.mode != 'section10' }}
        env:
          LEAN_NUM_THREADS: "4"
        shell: bash
        run: |
          mkdir -p .scratch/ci-verified
          lake -R build 2>&1 | tee .scratch/ci-verified/Build.log
          if grep -F "declaration uses 'sorry'" .scratch/ci-verified/Build.log; then
            exit 1
          fi

      - name: Inventory proposed statement dependencies
        if: ${{ steps.build.outcome == 'success' }}
        continue-on-error: true
        run: lake env python3 scripts/statement_surface.py

      - name: Run the headline audits concurrently
        id: audits
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          AUDIT_SCOPE: ${{ steps.scope.outputs.mode }}
          LEAN_NUM_THREADS: "4"
        run: lake env python3 scripts/verify_ci.py "$AUDIT_SCOPE"

      - name: Build the standalone Section10 target
        id: section10_build
        if: ${{ steps.scope.outputs.mode == 'section10' }}
        env:
          LEAN_NUM_THREADS: "4"
        shell: bash
        run: |
          mkdir -p .scratch/section10-verified
          lake -R build Section10 2>&1 | tee .scratch/section10-verified/Build.log
          if grep -F "declaration uses 'sorry'" .scratch/section10-verified/Build.log; then
            exit 1
          fi

      - name: Audit the Section 10 headline types and axioms
        id: section10_audit
        if: ${{ !cancelled() && steps.section10_build.outcome == 'success' }}
        run: lake env python3 scripts/verify_ci.py section10

      - name: Publish verification summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ "${{ steps.scope.outputs.mode }}" == section10 ]]; then
            cat <<'SUMMARY' >> "$GITHUB_STEP_SUMMARY"
          ## Standalone Section 10 verification

          | Check | Outcome |
          | --- | --- |
          | `lake -R build Section10` | ${{ steps.section10_build.outcome }} |
          | Section 10 headline types and axioms | ${{ steps.section10_audit.outcome }} |

          The verification artifact contains the build log and the full headline audit.
          SUMMARY
            exit 0
          fi
          cat <<'SUMMARY' >> "$GITHUB_STEP_SUMMARY"
          ## Lean verification

          Audit mode: ${{ steps.scope.outputs.mode }}.
          The `built` mode uses this run's Lake artifacts for headline audits.
          The `all` mode also runs the independent section source verifiers.

          | Check | Outcome |
          | --- | --- |
          | Pinned project build | ${{ steps.build.outcome }} |
          | Compiled import cache regression checks | ${{ steps.provenance.outcome }} |
          | Published QE headline types and axioms | ${{ steps.audits.outputs.foundation || 'skipped' }} |
          | Section 3 headline types and axioms | ${{ steps.audits.outputs.section3 || 'skipped' }} |
          | Section 4 headline types and axioms | ${{ steps.audits.outputs.section4 || 'skipped' }} |
          | Section 5 headline types and axioms | ${{ steps.audits.outputs.section5 || 'skipped' }} |
          | Section 6 headline types and axioms | ${{ steps.audits.outputs.section6 || 'skipped' }} |
          | Section 7 headline types and axioms | ${{ steps.audits.outputs.section7 || 'skipped' }} |
          | Section 8 headline types and axioms | ${{ steps.audits.outputs.section8 || 'skipped' }} |
          | Section 9 headline types and axioms | ${{ steps.audits.outputs.section9 || 'skipped' }} |
          | Section 10 headline types and axioms | ${{ steps.audits.outputs.section10 || 'skipped' }} |

          Download the verification artifact for compiler logs and headline audits.
          A skipped step is not a passed check. This run covers the current library
          entry points and selected headlines, not every paper result or legacy file.
          Explicit hypotheses and fidelity to the paper still need review.
          SUMMARY

      - name: Retain verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: lean-verification-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
          path: |
            lean-toolchain
            lake-manifest.json
            .scratch/ci-verified/**
            .scratch/section3-verified/*.log
            .scratch/section3-verified/*.json
            .scratch/section3-verified/*.txt
            .scratch/section3-verified/HeadlineAudit.lean
            .scratch/section4-verified/*.log
            .scratch/section4-verified/*.json
            .scratch/section4-verified/*.txt
            .scratch/section4-verified/HeadlineAudit.lean
            .scratch/section4-verified/CombinedImport.lean
            .scratch/section5-verified/*.log
            .scratch/section5-verified/*.json
            .scratch/section5-verified/*.txt
            .scratch/section5-verified/*.lean
            .scratch/section7-verified/*.log
            .scratch/section7-verified/*.json
            .scratch/section7-verified/*.txt
            .scratch/section7-verified/*.lean
            .scratch/section9-verified/*
            .scratch/section10-verified/*
